# Read by portfolio-ops jobs (dispatcher, scans, test review). Changes need human-approved.
app: portfolio
web: true
install: npm ci
verify: npm ci && npm run build && npm run smoke
# e2e, coverage, dead_code and mutation are filled in by later slices.

# Agent-safe tier (portfolio-ops decision 0005): agent PRs for queued, non-pivotal issues merge without human-approved unless they touch a path below.
agent_safe: true
agent_max_lines: 400
sensitive_paths:
  - astro.config.mjs # build and deploy configuration: a wrong change can break the live site
  - scripts/ # smoke, performance and accessibility checks that CI relies on; weakening them would hide regressions
pivotal_paths:
  - src/pages/index.astro # the landing page: who the owner is, and the six project cards
  - src/layouts/Base.astro # shared page shell that wraps every page (will carry navigation and the motion toggle)
  - src/pages/example-project.mdx # the project page template: try it, then the case study
